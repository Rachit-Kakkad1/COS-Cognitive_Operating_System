<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo">🏢 COS WorkSense</div>
    <div class="header-right">
      <span id="role-badge" class="badge">Manager</span>
      <span id="status-dot" class="dot offline"></span>
    </div>
  </div>

  <!-- Tab navigation -->
  <div class="tabs">
    <button class="tab active" data-tab="dashboard">Dashboard</button>
    <button class="tab"        data-tab="focus">Focus Report</button>
    <button class="tab"        data-tab="productivity">Productivity</button>
    <button class="tab"        data-tab="system">System</button>
  </div>

  <!-- TAB 1: Dashboard -->
  <div id="tab-dashboard" class="tab-content active">
    <div class="section-label">LIVE TEAM STATUS</div>
    <div id="employee-list">
      <div class="loading">Loading employees...</div>
    </div>
    <button id="open-dashboard" class="btn-primary" onclick="window.open('http://localhost:5173/worksense', '_blank')">
      Open Full Dashboard
    </button>
  </div>

  <!-- TAB 2: Focus Report -->
  <div id="tab-focus" class="tab-content">
    <div class="section-label">TODAY'S FOCUS INTELLIGENCE</div>
    <div id="focus-report">
      <div class="loading">Loading report...</div>
    </div>
    <button id="generate-report" class="btn-secondary">
      Generate Now
    </button>
  </div>

  <!-- TAB 3: Productivity Matrix -->
  <div id="tab-productivity" class="tab-content">
    <div class="section-label">PRODUCTIVITY MATRIX</div>
    <div id="productivity-matrix">
      <div class="loading">Loading matrix...</div>
    </div>
  </div>

  <!-- TAB 4: System Health -->
  <div id="tab-system" class="tab-content">
    <div class="section-label">SYSTEM HEALTH</div>

    <!-- CPU Section -->
    <div class="system-card">
      <div class="system-card-header">
        <span>⚡ CPU Usage</span>
        <span id="cpu-value" class="system-value">--</span>
      </div>
      <div class="progress-bar">
        <div id="cpu-bar" class="progress-fill cpu"></div>
      </div>
      <div id="cpu-alert" class="alert hidden">
        ⚠️ High CPU detected
        <button id="kill-tab-btn" class="btn-danger">Kill Tab</button>
      </div>
    </div>

    <!-- Power Section -->
    <div class="system-card">
      <div class="system-card-header">
        <span>🔋 Power Drain — Top 5 Tabs</span>
      </div>
      <div id="power-list">
        <div class="loading">Scanning tabs...</div>
      </div>
    </div>

    <button id="refresh-system" class="btn-secondary">
      Refresh Now
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
