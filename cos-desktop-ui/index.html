<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>COS — Cognitive Operating System</title>
    <meta name="description" content="Your AI-powered cognitive extension that preserves context and restores focus." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function(e) {
        var errDiv = document.createElement('div');
        errDiv.style = "position:fixed;top:0;left:0;width:100%;height:100vh;background:red;color:white;z-index:999999;padding:2rem;font-family:monospace;white-space:pre-wrap;overflow:auto;";
        errDiv.innerHTML = "<h1>Global Uncaught Error!</h1><h2>" + e.message + "</h2><p>" + e.filename + ":" + e.lineno + "</p><pre>" + (e.error ? e.error.stack : '') + "</pre>";
        document.body.appendChild(errDiv);
      });
      window.addEventListener('unhandledrejection', function(e) {
        var errDiv = document.createElement('div');
        errDiv.style = "position:fixed;top:0;left:0;width:100%;height:100vh;background:orange;color:black;z-index:999999;padding:2rem;font-family:monospace;white-space:pre-wrap;overflow:auto;";
        errDiv.innerHTML = "<h1>Unhandled Promise Rejection!</h1><h2>" + e.reason + "</h2><pre>" + (e.reason && e.reason.stack ? e.reason.stack : '') + "</pre>";
        document.body.appendChild(errDiv);
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
