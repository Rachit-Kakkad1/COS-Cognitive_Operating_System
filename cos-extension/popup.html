<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <span class="logo">🧠 COS</span>
    <span id="status-dot" class="dot offline"></span>
  </div>
  <div class="section">
    <div class="label">Currently capturing</div>
    <div id="current-tab" class="value">Loading...</div>
  </div>
  <div class="section">
    <div class="label">Time on page</div>
    <div id="time-spent" class="value">0s</div>
  </div>
  <div class="section">
    <div class="label">Snapshots today</div>
    <div id="snapshot-count" class="value">0</div>
  </div>
  <div class="section">
    <div class="label">Queued offline</div>
    <div id="queue-count" class="value">0</div>
  </div>
  <div class="section">
    <div class="flex-between">
      <div class="label">Auto-Capture</div>
      <label class="switch">
        <input type="checkbox" id="auto-capture-toggle" checked>
        <span class="slider round"></span>
      </label>
    </div>
  </div>

  <div class="section">
    <div class="label">Last captured</div>
    <div id="last-capture-time" class="value">Never</div>
  </div>

  <button id="capture-now">Manual Capture</button>
  <button id="open-cos">Open COS</button>
  <script src="popup.js"></script>
</body>
</html>
