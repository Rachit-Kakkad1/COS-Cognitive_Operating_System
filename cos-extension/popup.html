<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Ambient glow background -->
  <div class="ambient-glow"></div>

  <!-- ─── Header ─────────────────────────────────────────── -->
  <header class="header">
    <div class="brand">
      <div class="brain-ring">
        <div class="brain-icon">🧠</div>
        <svg class="orbit-ring" viewBox="0 0 36 36">
          <circle cx="18" cy="18" r="16" fill="none" stroke="url(#grad)" stroke-width="1.5" stroke-dasharray="20 80" stroke-linecap="round"/>
          <defs>
            <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#818cf8"/>
              <stop offset="100%" style="stop-color:#06b6d4"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">COS Personal</span>
        <span class="brand-sub">Cognitive Context Capture</span>
      </div>
    </div>
    <div class="status-pill" id="status-pill">
      <span class="status-dot" id="status-dot"></span>
      <span class="status-text" id="status-text">Offline</span>
    </div>
  </header>

  <!-- ─── Active Context Card ────────────────────────────── -->
  <div class="context-card">
    <div class="context-label">
      <span class="pulse-dot"></span>
      Currently capturing
    </div>
    <div class="context-title" id="current-tab">Loading…</div>
    <div class="context-meta">
      <div class="meta-chip">
        <span class="meta-icon">⏱</span>
        <span id="time-spent">0s</span>
      </div>
      <div class="meta-chip">
        <span class="meta-icon">📸</span>
        <span id="snapshot-count">0</span> today
      </div>
    </div>
  </div>

  <!-- ─── Stats Grid ─────────────────────────────────────── -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-value" id="total-memories">—</div>
      <div class="stat-label">Memories</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="queue-count">0</div>
      <div class="stat-label">Queued</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="last-capture-time">—</div>
      <div class="stat-label">Last sync</div>
    </div>
  </div>

  <!-- ─── Controls ───────────────────────────────────────── -->
  <div class="controls">
    <div class="toggle-row">
      <div class="toggle-info">
        <span class="toggle-label">Auto-Capture</span>
        <span class="toggle-hint">Every 30 seconds</span>
      </div>
      <label class="toggle">
        <input type="checkbox" id="auto-capture-toggle" checked>
        <span class="toggle-track">
          <span class="toggle-thumb"></span>
        </span>
      </label>
    </div>
  </div>

  <!-- ─── Action Buttons ─────────────────────────────────── -->
  <div class="actions">
    <button id="capture-now" class="btn btn-primary">
      <span class="btn-icon">⚡</span>
      <span class="btn-text">Capture Now</span>
    </button>
    <button id="open-cos" class="btn btn-ghost">
      <span class="btn-icon">🔮</span>
      <span class="btn-text">Open Dashboard</span>
    </button>
  </div>

  <!-- ─── Footer ─────────────────────────────────────────── -->
  <div class="footer">
    <span>COS v1.1</span>
    <span class="footer-sep">·</span>
    <span>Context is memory</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
