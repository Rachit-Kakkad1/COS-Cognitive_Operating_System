<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COS WorkSense</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">🏢 COS WorkSense <span id="role-badge">employee</span> <span class="live">● live</span></header>
  <div class="tabs">
    <button type="button" data-tab="dashboard" class="active">Dashboard</button>
    <button type="button" data-tab="focus">Focus</button>
    <button type="button" data-tab="productivity">Productivity</button>
    <button type="button" data-tab="system">System</button>
  </div>
  <div id="panel-dashboard" class="panel active">
    <h3>Live Team Status</h3>
    <div id="dashboard-list"></div>
    <a href="http://localhost:5176/dashboard" target="_blank" class="btn btn-primary">→ Open Full Dashboard</a>
  </div>
  <div id="panel-focus" class="panel">
    <h3>Today's Focus Intelligence</h3>
    <div id="focus-summary"></div>
    <button type="button" id="focus-generate" class="btn btn-secondary">Generate Now</button>
  </div>
  <div id="panel-productivity" class="panel">
    <h3>Productivity Matrix</h3>
    <div id="productivity-list"></div>
    <a href="http://localhost:5176/matrix" target="_blank" class="btn btn-primary">→ Open Full Matrix</a>
  </div>
  <div id="panel-system" class="panel">
    <h3>System</h3>
    <div id="system-cpu" class="metric">⚡ CPU: —%</div>
    <div id="system-drain" class="metric">🔋 Top drain: —</div>
    <button type="button" id="system-refresh" class="btn btn-secondary">Refresh</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
