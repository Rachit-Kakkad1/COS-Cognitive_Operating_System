<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COS Teams</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 360px; min-height: 400px; font-family: system-ui, sans-serif; background: #0f0f0f; color: #fff; }
    .tabs { display: flex; border-bottom: 1px solid #2a2a2a; }
    .tabs button { flex: 1; padding: 12px; background: transparent; border: none; color: #a1a1aa; cursor: pointer; font-size: 13px; }
    .tabs button.active { color: #f59e0b; font-weight: 600; border-bottom: 2px solid #f59e0b; }
    .panel { display: none; padding: 16px; }
    .panel.active { display: block; }
    .context-title { font-size: 14px; color: #fff; margin: 12px 0; word-break: break-all; }
    .chip { display: inline-block; background: #1a1a1a; padding: 4px 10px; border-radius: 20px; font-size: 12px; color: #a1a1aa; margin-right: 8px; margin-bottom: 8px; }
    .btn { width: 100%; padding: 12px; margin-top: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 14px; }
    .btn-primary { background: #f59e0b; color: #000; }
    .qr-wrap { text-align: center; margin: 16px 0; }
    .qr-wrap img { max-width: 240px; height: auto; border-radius: 8px; }
    .member-list { list-style: none; }
    .member-list li { padding: 8px 0; border-bottom: 1px solid #2a2a2a; display: flex; align-items: center; gap: 8px; }
    .member-list .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
    .member-list .dot.idle { background: #a1a1aa; }
    .member-list .dot.distracted { background: #eab308; }
  </style>
</head>
<body>
  <div class="tabs">
    <button type="button" data-tab="you" class="active">You</button>
    <button type="button" data-tab="team">Team</button>
    <button type="button" data-tab="handoff">Handoff</button>
  </div>
  <div id="panel-you" class="panel active">
    <div class="context-label" style="font-size: 11px; color: #a1a1aa;">Current context</div>
    <div id="current-context" class="context-title">—</div>
    <div><span class="chip">Focus: <span id="focus-score">75</span>/100</span></div>
    <button type="button" id="capture-now" class="btn btn-primary">Capture to team</button>
  </div>
  <div id="panel-team" class="panel">
    <div class="context-label" style="font-size: 11px; color: #a1a1aa;">Team status</div>
    <ul id="member-list" class="member-list"></ul>
  </div>
  <div id="panel-handoff" class="panel">
    <div class="context-label" style="font-size: 11px; color: #a1a1aa;">Share your thinking</div>
    <button type="button" id="generate-qr" class="btn btn-primary">🤝 Generate Handoff QR</button>
    <div id="qr-result" class="qr-wrap"></div>
    <p id="handoff-hint" style="font-size: 12px; color: #a1a1aa; margin-top: 8px;">Share this QR with your teammate</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
